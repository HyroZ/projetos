<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio JS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
<h1 style="color: blue; font-size: 24px;">Exercício JavaScript</h1>
    <p>Este é um exemplo de exercício em JavaScript.</p>
    <script>
        var nome = prompt("Digite seu nome:");
        document.write(`Olá, <strong>${nome}</strong>! Seu nome tem ${nome.length} letras.<br>`);
        document.write(`Seu nome em maiúsculas é <strong>${nome.toUpperCase()}</strong>.`);
    </script>
</body>
</html>
