<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somando Números</title>
    <style>
        .calc {
            font: normal 20pt Arial;
            align-items: center;
            text-align: center;
        }
        .inputs {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>
   <div class="calc"> 
    <h1>Somando Números</h1>
    </div>
    <div class="inputs">
    <input type="number" name="txtn1" id="txtn1" placeholder="Digite um número">
    <input type="number" name="txtn2" id="txtn2" placeholder="Digite outro número">
    <input type="button" value="Somar" onclick="somar()">   
    </div>
    <script >
        function somar() {
            var tn1= Number(document.getElementById('txtn1').value);
            var tn2 = window.document.querySelector('input#txtn2').value;
            var s = tn1 + tn2;
            alert(`A soma entre ${tn1} e ${tn2} é igual a ${s}`);
        }
        </script>
</body>
</html>
