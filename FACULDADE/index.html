<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação de animações CSS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"></script>
</head>
<body>
  <h1 style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Teste de Animações CSS</h1>
  <p style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Abra o console do navegador para ver o resultado da verificação de suporte às animações CSS.</p>
  <script>
    if (Modernizr.cssanimations) {
      console.log("Animações CSS são suportadas!");
    } else {
      console.log("Animações CSS NÃO são suportadas.");
    }
  </script>
</body>
</html>
