<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jogo da Memória</title>
</head>

<body>
    <h1>Jogo da Memória</h1>
    <div id="game-setup">
        <input type="text" id="player-name" placeholder="Digite seu nome">
        <button class="btn" onclick="startGame()">Iniciar Jogo</button>
    </div>
    <div id="game-info" style="display: none;">
        <p>Jogador: <span id="player-name-display"></span></p>
        <p>Pontuação: <span id="score-display">0</span></p>
        <p>Tempo: <span id="time">0</span></p>
        <button class="btn" onclick="restartGame()">Reiniciar Jogo</button>
    </div>
    <div id="game-board" style="display: none;"></div>
    <p id="game-message"></p>
    <script src="script.js"></script>
</body>

</html>
