<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jogo da Memória</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Jogo da Memória</h1>
            <div id="game-setup">
                <input type="text" id="player-name" placeholder="Digite seu nome">
                <button class="btn" onclick="startGame()">Iniciar Jogo</button>
            </div>
        </div>

        <div class="main">
            <div id="game-board" style="display: none;"></div>

            <aside class="sidebar">
                <div id="game-info" style="display: none;" class="score-card">
                    <p><strong>Jogador:</strong> <span id="player-name-display"></span></p>
                    <p><strong>Pontuação:</strong> <span id="score-display">0</span></p>
                    <p><strong>Tempo:</strong> <span id="time">0</span></p>
                    <button class="btn" onclick="restartGame()">Reiniciar Jogo</button>
                </div>
                <p id="game-message"></p>
            </aside>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
